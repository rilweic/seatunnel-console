# The console stack: MySQL, xxl-job-admin and the console (UI + API + XXL-JOB executor).
# The SeaTunnel Zeta cluster is NOT included; point CONSOLE_ZETA_MASTER_URLS at it (docs/design.md §4.3).
#
#   cp .env.example .env    # then fill in the passwords and keys
#   docker compose up -d --build
#
# Open http://localhost:${CONSOLE_PORT} and log in as admin with CONSOLE_ADMIN_PASSWORD.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      CONSOLE_DB_PASSWORD: ${CONSOLE_DB_PASSWORD:?set CONSOLE_DB_PASSWORD in .env}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN in .env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 01: console database and account; 02: official XXL-JOB 3.5.0 schema; 03: the console's executor group
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.5.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=${TZ:-Asia/Shanghai}
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    ports:
      # Admin UI for scheduler logs; default account admin/123456, change it after the first login.
      - "${XXL_JOB_PORT:-8081}:8080"
    restart: unless-stopped

  console:
    build:
      context: ..
    depends_on:
      mysql:
        condition: service_healthy
      xxl-job-admin:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CONSOLE_DB_URL: jdbc:mysql://mysql:3306/seatunnel_console?useUnicode=true&characterEncoding=UTF-8&serverTimezone=${TZ:-Asia/Shanghai}
      CONSOLE_DB_USERNAME: console
      CONSOLE_DB_PASSWORD: ${CONSOLE_DB_PASSWORD}
      CONSOLE_SECRET_KEY: ${CONSOLE_SECRET_KEY:?set CONSOLE_SECRET_KEY in .env (openssl rand -base64 32)}
      CONSOLE_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD:?set CONSOLE_ADMIN_PASSWORD in .env}
      CONSOLE_ZETA_MASTER_URLS: ${CONSOLE_ZETA_MASTER_URLS:-http://host.docker.internal:8080}
      CONSOLE_ZETA_USERNAME: ${CONSOLE_ZETA_USERNAME:-admin}
      CONSOLE_ZETA_PASSWORD: ${CONSOLE_ZETA_PASSWORD:-}
      CONSOLE_XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080
      CONSOLE_XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN}
      CONSOLE_XXL_JOB_GROUP_ID: "10"
      # xxl-job-admin calls the executor back by this address inside the compose network
      CONSOLE_XXL_JOB_EXECUTOR_ADDRESS: http://console:9999/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CONSOLE_PORT:-8088}:8088"
    volumes:
      - console-data:/app/data
      - console-logs:/app/logs
    restart: unless-stopped

volumes:
  mysql-data:
  console-data:
  console-logs:
